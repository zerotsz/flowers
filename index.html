<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jardín de Girasoles</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050a0e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Botón Tócame */
    .touch-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #ffd700, #ff9900);
      color: #1a0f00;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
      transition: all 0.3s ease;
      z-index: 10;
    }
    .touch-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
    }

    /* Overlay / Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: rgba(20, 25, 35, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 30px;
      border-radius: 20px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.2);
      transform: translateY(20px);
      transition: transform 0.4s ease;
      position: relative;
      color: #ffffff;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }
    .modal-title {
      font-size: 20px;
      color: #ffe680;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .modal-signature {
      font-size: 14px;
      color: #ffd700;
      font-style: italic;
      margin-bottom: 20px;
    }
    .modal-quote-box {
      border-top: 1px solid rgba(255, 215, 0, 0.2);
      padding-top: 15px;
      margin-top: 10px;
    }
    .modal-quote {
      font-size: 15px;
      color: #e0e6ed;
      font-style: italic;
      line-height: 1.5;
    }
    .modal-quote-author {
      font-size: 12px;
      color: #8a99ad;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: #8a99ad;
      font-size: 22px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-btn:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <button class="touch-btn" id="openBtn">Tócame</button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" id="closeBtn">&times;</button>
      <div class="modal-title">
        eres mi china preciosa para que veas q soy romantico pero tambien mamon pero te quiero mcuhote
      </div>
      <div class="modal-signature">
        by: el que se muere por ti
      </div>
      <div class="modal-quote-box">
        <div class="modal-quote">
          "Yo ya gasté toda mi suerte, mi suerte la usé en encontrarte a ti"
        </div>
        <div class="modal-quote-author">— Morat</div>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initFlowers();
    });

    // Luciérnagas / Partículas de fondo
    const fireflies = [];
    for (let i = 0; i < 55; i++) {
      fireflies.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2 + 1,
        alpha: Math.random(),
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.5,
        pulseSpeed: 0.01 + Math.random() * 0.02
      });
    }

    // Pétalos flotantes
    const fallingPetals = [];

    function addPetal(x, y) {
      fallingPetals.push({
        x: x || Math.random() * width,
        y: y || -20,
        size: Math.random() * 8 + 6,
        vx: (Math.random() - 0.5) * 1.5,
        vy: Math.random() * 1.5 + 0.8,
        angle: Math.random() * Math.PI * 2,
        vAngle: (Math.random() - 0.5) * 0.05
      });
    }

    setInterval(() => {
      if (fallingPetals.length < 30) addPetal();
    }, 350);

    // Estructura de Flores
    class Flower {
      constructor(xRatio, heightRatio, petalCount, scale = 1) {
        this.xRatio = xRatio;
        this.heightRatio = heightRatio;
        this.petalCount = petalCount;
        this.scale = scale;
        this.angle = 0;
        this.offset = Math.random() * 100;
        this.updatePosition();
      }

      updatePosition() {
        this.x = width * this.xRatio;
        this.targetHeight = height * this.heightRatio;
      }

      draw(time) {
        const wind = Math.sin(time * 0.0015 + this.offset) * 0.15;
        this.angle += (wind - this.angle) * 0.05;

        const startX = this.x;
        const startY = height;
        const endX = this.x + Math.sin(this.angle) * (50 * this.scale);
        const endY = height - this.targetHeight;
        const controlX = this.x + Math.sin(this.angle * 0.5) * (25 * this.scale);
        const controlY = height - this.targetHeight * 0.5;

        // Dibujar tallo
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(controlX, controlY, endX, endY);
        ctx.strokeStyle = '#2d5a27';
        ctx.lineWidth = 6 * this.scale;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.strokeStyle = '#4e8d3e';
        ctx.lineWidth = 3 * this.scale;
        ctx.stroke();

        // Dibujar flor
        ctx.save();
        ctx.translate(endX, endY);
        ctx.rotate(this.angle * 0.5);
        ctx.scale(this.scale, this.scale);

        // Pétalos
        for (let i = 0; i < this.petalCount; i++) {
          const pAngle = (i / this.petalCount) * Math.PI * 2;
          ctx.save();
          ctx.rotate(pAngle);

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-15, -25, -20, -50, 0, -60);
          ctx.bezierCurveTo(20, -50, 15, -25, 0, 0);

          const grad = ctx.createLinearGradient(0, 0, 0, -60);
          grad.addColorStop(0, '#e68a00');
          grad.addColorStop(0.3, '#ffcc00');
          grad.addColorStop(1, '#ffeb66');

          ctx.fillStyle = grad;
          ctx.shadowColor = 'rgba(255, 215, 0, 0.4)';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.restore();
        }

        // Centro (Pistilo)
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        const centerGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
        centerGrad.addColorStop(0, '#8b5a2b');
        centerGrad.addColorStop(1, '#4a2c11');
        ctx.fillStyle = centerGrad;
        ctx.shadowBlur = 0;
        ctx.fill();

        // Estambres
        for (let j = 0; j < 12; j++) {
          const stAngle = (j / 12) * Math.PI * 2;
          const sx = Math.cos(stAngle) * 12;
          const sy = Math.sin(stAngle) * 12;
          ctx.beginPath();
          ctx.arc(sx, sy, 2, 0, Math.PI * 2);
          ctx.fillStyle = '#ffd700';
          ctx.fill();
        }

        ctx.restore();
      }
    }

    let flowers = [];

    function initFlowers() {
      flowers = [
        // Jardín completo de 8 girasoles (del fondo al frente)
        new Flower(0.15, 0.42, 6, 0.75),
        new Flower(0.28, 0.48, 7, 0.85),
        new Flower(0.35, 0.58, 7, 1.0),
        new Flower(0.48, 0.45, 6, 0.80),
        new Flower(0.52, 0.68, 8, 1.1),
        new Flower(0.65, 0.55, 7, 1.0),
        new Flower(0.78, 0.46, 6, 0.82),
        new Flower(0.88, 0.52, 7, 0.9)
      ];
    }

    initFlowers();

    // Interacción al hacer clic
    canvas.addEventListener('click', (e) => {
      for (let i = 0; i < 6; i++) {
        addPetal(e.clientX + (Math.random() - 0.5) * 40, e.clientY + (Math.random() - 0.5) * 40);
      }
    });

    // Bucle de animación
    function animate(time) {
      ctx.clearRect(0, 0, width, height);

      // Fondo
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#04080e');
      bgGrad.addColorStop(1, '#0b1d28');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Luciérnagas
      fireflies.forEach(f => {
        f.x += f.speedX;
        f.y += f.speedY;
        f.alpha += f.pulseSpeed;

        if (f.alpha > 1 || f.alpha < 0.2) f.pulseSpeed = -f.pulseSpeed;
        if (f.x < 0) f.x = width;
        if (f.x > width) f.x = 0;
        if (f.y < 0) f.y = height;
        if (f.y > height) f.y = 0;

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 230, 100, ${Math.abs(f.alpha)})`;
        ctx.shadowColor = '#ffe666';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Flores
      flowers.forEach(flower => flower.draw(time));

      // Pétalos flotantes
      for (let i = fallingPetals.length - 1; i >= 0; i--) {
        const p = fallingPetals[i];
        p.x += p.vx + Math.sin(time * 0.002 + p.y * 0.01) * 0.5;
        p.y += p.vy;
        p.angle += p.vAngle;

        if (p.y > height + 20) {
          fallingPetals.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-p.size/2, -p.size, p.size/2, -p.size, 0, 0);
        ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // Modal
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const modalOverlay = document.getElementById('modalOverlay');

    openBtn.addEventListener('click', () => {
      modalOverlay.classList.add('active');
    });

    closeBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });
  </script>
</body>
</html>
