<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tulipanes y Sorpresa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03060a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Botones de la esquina superior */
    .top-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .main-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
      transition: all 0.3s ease;
    }
    .main-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
    }

    /* Overlay / Modales */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: rgba(20, 25, 35, 0.92);
      border: 1px solid rgba(255, 117, 140, 0.4);
      padding: 35px 30px;
      border-radius: 20px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(255,117,140,0.25);
      transform: translateY(20px);
      transition: transform 0.4s ease;
      position: relative;
      color: #ffffff;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 21px;
      color: #ffb3c6;
      margin-bottom: 20px;
      line-height: 1.5;
      font-weight: bold;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: #8a99ad;
      font-size: 22px;
      cursor: pointer;
    }
    .close-btn:hover {
      color: #ffffff;
    }

    /* Estilos del minijuego de elección */
    .choices-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      position: relative;
      height: 70px;
    }

    .choice-btn {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #btnCarlos {
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      color: #0d233a;
    }
    #btnCarlos:hover {
      background: linear-gradient(135deg, #8ab5fc, #a5defb);
    }

    #btnOrlando {
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      color: #4a1518;
      z-index: 105;
      transition: top 0.12s ease-out, left 0.12s ease-out;
    }
  </style>
</head>
<body>

  <!-- Audio de fondo (Asegúrate de tener un archivo llamado morat.mp3 en la misma carpeta) -->
  <audio id="bgMusic" loop>
    <source src="morat.mp3" type="audio/mpeg">
  </audio>

  <!-- Botones Superiores -->
  <div class="top-buttons">
    <button class="main-btn" id="openPepaBtn">sí admito que soy una cerda-pepa pig</button>
    <button class="main-btn" id="openGameBtn">¿A quién eliges? 💖</button>
  </div>

  <!-- Modal 1: Mensaje Pepa Pig -->
  <div class="modal-overlay" id="pepaModal">
    <div class="modal-content">
      <button class="close-btn" id="closePepa">&times;</button>
      <div class="modal-title">
        jajajaajaj te cansaste de darle click y admitir q soy una tragona 🐷💖
      </div>
    </div>
  </div>

  <!-- Modal 2: Juego Interactivo ¿A quién eliges? -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-content" id="gameBox" style="min-height: 230px;">
      <button class="close-btn" id="closeGame">&times;</button>
      <div class="modal-title">¿A quién eliges? 🤔</div>
      <div class="choices-container" id="choiceArea">
        <button class="choice-btn" id="btnCarlos">Carlos</button>
        <button class="choice-btn" id="btnOrlando">Orlando</button>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bgMusic');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initTulips();
    });

    // Partículas de fondo estilo jardín nocturno mágico
    const particles = [];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2 + 0.5,
        alpha: Math.random(),
        speedY: (Math.random() - 0.5) * 0.4,
        pulse: 0.01 + Math.random() * 0.02
      });
    }

    // Clase Tulipán con pétalos grandes y abiertos
    class Tulip {
      constructor(xRatio, heightRatio, scale = 1, colorPrimary = '#ff4d79', colorSecondary = '#ffb3c6') {
        this.xRatio = xRatio;
        this.heightRatio = heightRatio;
        this.scale = scale;
        this.colorPrimary = colorPrimary;
        this.colorSecondary = colorSecondary;
        this.offset = Math.random() * 100;
        this.updatePosition();
      }

      updatePosition() {
        this.x = width * this.xRatio;
        this.targetHeight = height * this.heightRatio;
      }

      draw(time) {
        const wind = Math.sin(time * 0.0015 + this.offset) * 0.12;
        const startX = this.x;
        const startY = height;
        const endX = this.x + Math.sin(wind) * (45 * this.scale);
        const endY = height - this.targetHeight;
        const controlX = this.x + Math.sin(wind * 0.5) * (22 * this.scale);
        const controlY = height - this.targetHeight * 0.5;

        // Tallo
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(controlX, controlY, endX, endY);
        ctx.strokeStyle = '#2d5a27';
        ctx.lineWidth = 6 * this.scale;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.strokeStyle = '#4e8d3e';
        ctx.lineWidth = 2.5 * this.scale;
        ctx.stroke();

        // Capullo de Tulipán Grande y Abierto
        ctx.save();
        ctx.translate(endX, endY);
        ctx.rotate(wind * 0.6);
        ctx.scale(this.scale, this.scale);

        // Pétalo izquierdo abierto
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-25, -15, -45, -35, -30, -60);
        ctx.bezierCurveTo(-15, -50, -5, -30, 0, 0);
        ctx.fillStyle = this.colorSecondary;
        ctx.fill();

        // Pétalo derecho abierto
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(25, -15, 45, -35, 30, -60);
        ctx.bezierCurveTo(15, -50, 5, -30, 0, 0);
        ctx.fillStyle = this.colorPrimary;
        ctx.fill();

        // Pétalo central principal
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-25, -10, -32, -50, 0, -70);
        ctx.bezierCurveTo(32, -50, 25, -10, 0, 0);

        const grad = ctx.createLinearGradient(0, 0, 0, -70);
        grad.addColorStop(0, this.colorSecondary);
        grad.addColorStop(1, this.colorPrimary);

        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(255, 105, 180, 0.5)';
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.restore();
      }
    }

    let tulips = [];
    function initTulips() {
      tulips = [
        new Tulip(0.12, 0.40, 0.8, '#ff3366', '#ff99bb'),
        new Tulip(0.25, 0.52, 0.95, '#ff1a75', '#ff80bf'),
        new Tulip(0.38, 0.62, 1.1, '#ff4d94', '#ffb3d9'),
        new Tulip(0.50, 0.48, 0.9, '#ff66b2', '#ff99cc'),
        new Tulip(0.62, 0.65, 1.15, '#ff1a40', '#ff8099'),
        new Tulip(0.75, 0.50, 1.0, '#ff3366', '#ff99bb'),
        new Tulip(0.88, 0.42, 0.85, '#ff4d94', '#ffb3d9')
      ];
    }
    initTulips();

    function animate(time) {
      ctx.clearRect(0, 0, width, height);

      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#020509');
      bgGrad.addColorStop(1, '#0c1b2a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.alpha += p.pulse;
        if (p.alpha > 1 || p.alpha < 0.2) p.pulse = -p.pulse;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 182, 193, ${Math.abs(p.alpha)})`;
        ctx.shadowColor = '#ffb6c1';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      tulips.forEach(t => t.draw(time));

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    function playMusicOnce() {
      music.play().catch(e => console.log("Audio play blocked", e));
    }

    const pepaModal = document.getElementById('pepaModal');
    const openPepaBtn = document.getElementById('openPepaBtn');
    const closePepa = document.getElementById('closePepa');

    openPepaBtn.addEventListener('click', () => {
      playMusicOnce();
      pepaModal.classList.add('active');
    });
    closePepa.addEventListener('click', () => pepaModal.classList.remove('active'));

    const gameModal = document.getElementById('gameModal');
    const openGameBtn = document.getElementById('openGameBtn');
    const closeGame = document.getElementById('closeGame');
    const btnOrlando = document.getElementById('btnOrlando');
    const btnCarlos = document.getElementById('btnCarlos');

    // Resetear posición de Orlando al abrir/cerrar
    function resetOrlandoPosition() {
      btnOrlando.style.position = 'static';
    }

    openGameBtn.addEventListener('click', () => {
      playMusicOnce();
      resetOrlandoPosition();
      gameModal.classList.add('active');
    });

    function closeGameModal() {
      gameModal.classList.remove('active');
      resetOrlandoPosition();
    }

    closeGame.addEventListener('click', closeGameModal);

    // Lógica para que el botón de Orlando huya dentro de los bordes visibles
    const escapeOrlando = () => {
      btnOrlando.style.position = 'fixed';
      
      const btnWidth = btnOrlando.offsetWidth || 120;
      const btnHeight = btnOrlando.offsetHeight || 45;
      const margin = 20;

      const maxX = window.innerWidth - btnWidth - margin;
      const maxY = window.innerHeight - btnHeight - margin;

      const randomX = Math.max(margin, Math.floor(Math.random() * maxX));
      const randomY = Math.max(margin, Math.floor(Math.random() * maxY));

      btnOrlando.style.left = `${randomX}px`;
      btnOrlando.style.top = `${randomY}px`;
    };

    document.addEventListener('mousemove', (e) => {
      if (!gameModal.classList.contains('active')) return;

      const rect = btnOrlando.getBoundingClientRect();
      const btnX = rect.left + rect.width / 2;
      const btnY = rect.top + rect.height / 2;

      const distance = Math.hypot(e.clientX - btnX, e.clientY - btnY);

      if (distance < 110) {
        escapeOrlando();
      }
    });

    btnOrlando.addEventListener('touchstart', (e) => {
      e.preventDefault();
      escapeOrlando();
    });

    btnOrlando.addEventListener('click', (e) => {
      e.preventDefault();
      escapeOrlando();
    });

    btnCarlos.addEventListener('click', () => {
      alert("sabias que elijirias a tu macho tu machete tu galactico tu media sandia tu george pig jajaajajaj ❤️🐷");
      closeGameModal();
    });

    window.addEventListener('click', (e) => {
      if (e.target === pepaModal) pepaModal.classList.remove('active');
      if (e.target === gameModal) closeGameModal();
    });
  </script>
</body>
</html>
