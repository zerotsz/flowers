<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tulipanes y Sorpresa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03060a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Botones de la esquina superior */
    .top-buttons {
      position: absolute;
      top: 15px;
      right: 15px;
      left: 15px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      z-index: 10;
    }

    .main-btn {
      padding: 10px 16px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
      transition: transform 0.2s ease;
    }
    .main-btn:active {
      transform: scale(0.95);
    }

    /* Overlay / Modales */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: rgba(20, 25, 35, 0.95);
      border: 1px solid rgba(255, 117, 140, 0.4);
      padding: 30px 20px;
      border-radius: 20px;
      width: 88%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(255,117,140,0.25);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      position: relative;
      color: #ffffff;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 19px;
      color: #ffb3c6;
      margin-bottom: 20px;
      line-height: 1.4;
      font-weight: bold;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: #8a99ad;
      font-size: 24px;
      cursor: pointer;
      padding: 5px;
    }

    /* Estilos del minijuego de elección */
    .choices-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      position: relative;
      min-height: 60px;
    }

    .choice-btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    #btnCarlos {
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      color: #0d233a;
    }

    #btnOrlando {
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      color: #4a1518;
      z-index: 105;
      transition: top 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), left 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
  </style>
</head>
<body>

  <!-- Audio de fondo (Asegúrate de colocar tu morat.mp3 en la misma carpeta) -->
  <audio id="bgMusic" loop preload="auto">
    <source src="morat.mp3" type="audio/mpeg">
  </audio>

  <!-- Botones Superiores -->
  <div class="top-buttons">
    <button class="main-btn" id="openPepaBtn">sí admito que soy una cerda-pepa pig</button>
    <button class="main-btn" id="openGameBtn">¿A quién eliges? 💖</button>
  </div>

  <!-- Modal 1: Mensaje Pepa Pig -->
  <div class="modal-overlay" id="pepaModal">
    <div class="modal-content">
      <button class="close-btn" id="closePepa">&times;</button>
      <div class="modal-title">
        jajajaajaj te cansaste de darle click y admitir q soy una tragona 🐷💖
      </div>
    </div>
  </div>

  <!-- Modal 2: Juego Interactivo ¿A quién eliges? -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-content">
      <button class="close-btn" id="closeGame">&times;</button>
      <div class="modal-title">¿A quién eliges? 🤔</div>
      <div class="choices-container" id="choiceArea">
        <button class="choice-btn" id="btnCarlos">Carlos</button>
        <button class="choice-btn" id="btnOrlando">Orlando</button>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bgMusic');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initTulips();
    });

    // Partículas de fondo estilo jardín nocturno
    const particles = [];
    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2 + 0.5,
        alpha: Math.random(),
        speedY: (Math.random() - 0.5) * 0.4,
        pulse: 0.01 + Math.random() * 0.02
      });
    }

    // Clase Tulipán grande y estilizado
    class Tulip {
      constructor(xRatio, heightRatio, scale = 1, colorPrimary = '#ff4d79', colorSecondary = '#ffb3c6') {
        this.xRatio = xRatio;
        this.heightRatio = heightRatio;
        this.scale = scale;
        this.colorPrimary = colorPrimary;
        this.colorSecondary = colorSecondary;
        this.offset = Math.random() * 100;
        this.updatePosition();
      }

      updatePosition() {
        this.x = width * this.xRatio;
        this.targetHeight = height * this.heightRatio;
      }

      draw(time) {
        const wind = Math.sin(time * 0.0015 + this.offset) * 0.12;
        const startX = this.x;
        const startY = height;
        const endX = this.x + Math.sin(wind) * (45 * this.scale);
        const endY = height - this.targetHeight;
        const controlX = this.x + Math.sin(wind * 0.5) * (22 * this.scale);
        const controlY = height - this.targetHeight * 0.5;

        // Tallo
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(controlX, controlY, endX, endY);
        ctx.strokeStyle = '#2d5a27';
        ctx.lineWidth = 6 * this.scale;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.strokeStyle = '#4e8d3e';
        ctx.lineWidth = 2.5 * this.scale;
        ctx.stroke();

        // Capullo Abierto
        ctx.save();
        ctx.translate(endX, endY);
        ctx.rotate(wind * 0.6);
        ctx.scale(this.scale, this.scale);

        // Pétalo izquierdo
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-25, -15, -45, -35, -30, -60);
        ctx.bezierCurveTo(-15, -50, -5, -30, 0, 0);
        ctx.fillStyle = this.colorSecondary;
        ctx.fill();

        // Pétalo derecho
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(25, -15, 45, -35, 30, -60);
        ctx.bezierCurveTo(15, -50, 5, -30, 0, 0);
        ctx.fillStyle = this.colorPrimary;
        ctx.fill();

        // Pétalo centro
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-25, -10, -32, -50, 0, -70);
        ctx.bezierCurveTo(32, -50, 25, -10, 0, 0);

        const grad = ctx.createLinearGradient(0, 0, 0, -70);
        grad.addColorStop(0, this.colorSecondary);
        grad.addColorStop(1, this.colorPrimary);

        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(255, 105, 180, 0.5)';
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.restore();
      }
    }

    let tulips = [];
    function initTulips() {
      tulips = [
        new Tulip(0.12, 0.38, 0.8, '#ff3366', '#ff99bb'),
        new Tulip(0.25, 0.48, 0.95, '#ff1a75', '#ff80bf'),
        new Tulip(0.38, 0.58, 1.1, '#ff4d94', '#ffb3d9'),
        new Tulip(0.50, 0.45, 0.9, '#ff66b2', '#ff99cc'),
        new Tulip(0.62, 0.60, 1.15, '#ff1a40', '#ff8099'),
        new Tulip(0.75, 0.46, 1.0, '#ff3366', '#ff99bb'),
        new Tulip(0.88, 0.38, 0.85, '#ff4d94', '#ffb3d9')
      ];
    }
    initTulips();

    function animate(time) {
      ctx.clearRect(0, 0, width, height);

      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#020509');
      bgGrad.addColorStop(1, '#0c1b2a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.alpha += p.pulse;
        if (p.alpha > 1 || p.alpha < 0.2) p.pulse = -p.pulse;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 182, 193, ${Math.abs(p.alpha)})`;
        ctx.shadowColor = '#ffb6c1';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      tulips.forEach(t => t.draw(time));

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    function playMusicOnce() {
      music.play().catch(e => console.log("Audio play blocked", e));
    }

    const pepaModal = document.getElementById('pepaModal');
    const openPepaBtn = document.getElementById('openPepaBtn');
    const closePepa = document.getElementById('closePepa');

    openPepaBtn.addEventListener('click', () => {
      playMusicOnce();
      pepaModal.classList.add('active');
    });
    closePepa.addEventListener('click', () => pepaModal.classList.remove('active'));

    const gameModal = document.getElementById('gameModal');
    const openGameBtn = document.getElementById('openGameBtn');
    const closeGame = document.getElementById('closeGame');
    const btnOrlando = document.getElementById('btnOrlando');
    const btnCarlos = document.getElementById('btnCarlos');

    function resetOrlandoPosition() {
      btnOrlando.style.position = 'static';
      btnOrlando.style.left = 'auto';
      btnOrlando.style.top = 'auto';
    }

    openGameBtn.addEventListener('click', () => {
      playMusicOnce();
      resetOrlandoPosition();
      gameModal.classList.add('active');
    });

    function closeGameModal() {
      gameModal.classList.remove('active');
      resetOrlandoPosition();
    }

    closeGame.addEventListener('click', closeGameModal);

    // Lógica de huida ajustada para pantallas móviles
    const escapeOrlando = () => {
      btnOrlando.style.position = 'fixed';

      const btnW = btnOrlando.offsetWidth || 100;
      const btnH = btnOrlando.offsetHeight || 40;
      const padding = 20;

      // Calcular espacio límite visible en móviles
      const minX = padding;
      const minY = padding + 50; // Evitar tapar botones superiores
      const maxX = window.innerWidth - btnW - padding;
      const maxY = window.innerHeight - btnH - padding;

      // Obtener posición actual del botón
      const rect = btnOrlando.getBoundingClientRect();
      let newX, newY;

      // Generar nuevas coordenadas alejadas de la posición actual
      do {
        newX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
        newY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
      } while (Math.hypot(newX - rect.left, newY - rect.top) < 150); // Mínimo 150px de salto

      btnOrlando.style.left = `${newX}px`;
      btnOrlando.style.top = `${newY}px`;
    };

    // Detección de proximidad en PC
    document.addEventListener('mousemove', (e) => {
      if (!gameModal.classList.contains('active')) return;

      const rect = btnOrlando.getBoundingClientRect();
      const btnX = rect.left + rect.width / 2;
      const btnY = rect.top + rect.height / 2;

      const distance = Math.hypot(e.clientX - btnX, e.clientY - btnY);

      if (distance < 100) {
        escapeOrlando();
      }
    });

    // Detección en celulares al intentar tocar
    btnOrlando.addEventListener('touchstart', (e) => {
      e.preventDefault();
      escapeOrlando();
    }, { passive: false });

    btnOrlando.addEventListener('click', (e) => {
      e.preventDefault();
      escapeOrlando();
    });

    btnCarlos.addEventListener('click', () => {
      alert("sabias que elijirias a tu macho tu machete tu galactico tu media sandia tu george pig jajaajajaj ❤️🐷");
      closeGameModal();
    });

    window.addEventListener('click', (e) => {
      if (e.target === pepaModal) pepaModal.classList.remove('active');
      if (e.target === gameModal) closeGameModal();
    });
  </script>
</body>
</html>
